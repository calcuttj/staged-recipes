# Same toolchain pin as the other dune-suite recipes (sysroot 2.17 / manylinux2014).
c_stdlib:
  - sysroot    # [linux]
c_stdlib_version:
  - "2.17"    # [linux]

# Pin ROOT to 6.36.6 to match the established DUNE/larsoft conda stack (genie,
# tpythia6, dunesw were all built against ROOT 6.36; conda-forge's current
# default is 6.40, which would silently diverge). 6.36.6 pairs with
# root_cxx_standard 20 (same as 6.40), so only root_base needs pinning.
root_base:
  - "6.36.6"
root_cxx_standard:
  - "20"
